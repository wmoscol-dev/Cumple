<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cumples Yape · Control de Recaudo Avanzado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5B1F8C">
<meta name="description" content="Control de recaudo para cumpleaños vía Yape">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cumples Yape">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  :root{
    --yape-purple:#5B1F8C;
    --yape-purple-2:#7E2FBF;
    --plin-teal:#00C9B7;
    --bill-green:#2E6B3E;
    --bill-green-dark:#1F4B2B;
    --gold:#D9A63C;
    --ink:#1A0F26;
    --paper:#F4EEFB;
    --muted:#B9A9D6;
    --danger:#E24C4C;
    --ok:#3DD68C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, #3A1758 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, #0E2E2A 0%, transparent 50%),
      #0B0512;
    font-family:'Inter',sans-serif;
    padding:32px 16px;
    overflow-y:auto;
  }

  /* ---------- CONTENEDOR PRINCIPAL ---------- */
  .main-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ---------- TABS DE PESTAÑAS ---------- */
  .tabs-container {
    display: flex;
    gap: 8px;
    max-width: 390px;
    overflow-x: auto;
    padding: 4px 8px;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--gold);
    color: #1A0F26;
    border-color: var(--gold);
    box-shadow: 0 4px 12px rgba(219, 166, 60, 0.3);
  }

  /* ---------- PHONE FRAME ---------- */
  .device{
    position:relative;
    width:390px;
    max-width:94vw;
    height:820px;
    background:linear-gradient(155deg,#2b2b2f,#0a0a0c 60%);
    border-radius:56px;
    padding:14px;
    box-shadow:
      0 60px 120px -30px rgba(91,31,140,.45),
      0 20px 40px -10px rgba(0,0,0,.6),
      inset 0 0 0 2px rgba(255,255,255,.04);
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    background:var(--paper);
    border-radius:42px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  }
  


  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:118px; height:32px; background:#0a0a0c;
    border-radius:0 0 20px 20px;
    z-index:50;
  }
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px 4px;
    font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px;
    color:var(--ink);
    flex-shrink:0;
    background:transparent;
  }
  .statusbar .icons{display:flex; align-items:center; gap:5px;}

  /* ---------- APP HEADER ---------- */
  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-top: 4px;
  }
  .app-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 20px 2px;
  }
  .app-title{
    font-family:'Sora',sans-serif; font-weight:800; font-size:15px;
    color:var(--ink); letter-spacing:.2px;
    display:flex; align-items:center; gap:6px;
  }
  .app-title .dot{width:7px;height:7px;border-radius:50%;background:#2E6B3E;box-shadow:0 0 0 3px rgba(46,107,62,.25);}
  
  .topbar-actions {
    display: flex;
    gap: 6px;
  }
  .excel-btn-label, .export-btn {
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    border: none;
    transition: background 0.2s;
  }
  .excel-btn-label {
    background: rgba(46, 107, 62, 0.15);
    color: var(--bill-green);
  }
  .excel-btn-label:hover { background: rgba(46, 107, 62, 0.25); }
  .export-btn {
    background: rgba(217, 166, 60, 0.15);
    color: #b58116;
  }
  .export-btn:hover { background: rgba(217, 166, 60, 0.25); }
  #excelFile { display: none; }

  .bill-card{
    margin: 8px 16px 6px;
    border-radius:20px;
    padding: 14px 16px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 88% -10%, rgba(217,166,60,.35), transparent 55%),
      linear-gradient(135deg, #2E6B3E 0%, #1F4B2B 100%);
    color:#EFF6EE;
    box-shadow:0 14px 28px -10px rgba(46,107,62,.35);
  }
  .bill-card::after{
    content:'';
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .bill-top{display:flex; align-items:center; justify-content:space-between;}
  
  .bill-name{
    font-family:'Sora',sans-serif; font-weight:800; font-size:20px;
  }
  .bill-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:700;
    background:rgba(217,166,60,.9);
    color:#2A1B03;
    padding:4px 9px; border-radius:20px;
    white-space:nowrap;
  }
  .bill-amount-row{
    display:flex; align-items:baseline; gap:6px; margin-top:8px;
  }
  .bill-currency{font-family:'Sora',sans-serif; font-weight:700; font-size:16px; opacity:.75;}
  .bill-amount{font-family:'Sora',sans-serif; font-weight:800; font-size:32px; letter-spacing:-1px;}

  .progress-track{
    margin-top:10px; height:6px; border-radius:8px;
    background:rgba(255,255,255,.16); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--gold), #F4D584);
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  .progress-labels{
    display:flex; justify-content:space-between; margin-top:5px;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:rgba(239,246,238,.75);
  }

  /* ---------- LIST ---------- */
  .list-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px 4px;
  }
  .list-head h2{
    margin:0; font-family:'Sora',sans-serif; font-size:12px; font-weight:700;
    color:var(--ink); text-transform:uppercase; letter-spacing:.6px;
  }
  .list-head .count{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:#7A6A98;
  }

  .list{
    flex:1;
    overflow-y:auto;
    padding:0 12px 10px;
    scrollbar-width:none;
  }
  .list::-webkit-scrollbar{display:none;}

  .row{
    display:flex; align-items:center; gap:11px;
    padding:8px 8px;
    border-radius:16px;
    margin:2px 0;
    transition:background .25s;
    position:relative;
  }
  
  /* Destacar cumpleañero (Estado 0) */
  .row.birthday-highlight {
    background: linear-gradient(90deg, rgba(217,166,60,.28), rgba(217,166,60,.06));
    box-shadow: 0 0 0 1.5px var(--gold);
    padding: 12px 10px;
    margin: 8px 2px;
  }
  .row.birthday-highlight .avatar{
    width:48px; height:48px; font-size:16px;
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--gold);
  }
  
  .crown{
    position:absolute; top:-11px; left:22px; font-size:15px;
    transform:rotate(-14deg);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .lock{
    width:46px; height:27px; border-radius:20px;
    background:rgba(217,166,60,.18);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); flex-shrink:0;
    box-shadow:inset 0 0 0 1.5px rgba(217,166,60,.5);
  }
  .avatar{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px;
    color:#fff; flex-shrink:0;
    position:relative;
  }
  .avatar .gift{
    position:absolute; bottom:-4px; right:-4px;
    width:18px; height:18px; border-radius:50%;
    background:var(--gold); color:#2A1B03;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; box-shadow:0 0 0 2px var(--paper);
  }
  .row-mid{flex:1; min-width:0;}
  .row-name{
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px; color:var(--ink);
    display:flex; align-items:center; gap:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-name .pill{
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
    background:var(--gold); color:#2A1B03; padding:1px 6px; border-radius:8px;
  }
  .row-meta{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:#8A7AAE;
    margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .amt{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px;
    min-width:34px; text-align:right;
  }
  .row.state-1 .amt { color: var(--bill-green); }
  .row.state-2 .amt { color: var(--danger); }

  .toggle{
    width:46px; height:27px; border-radius:20px;
    position:relative; cursor:pointer;
    border:none; padding:0; flex-shrink:0;
    transition:background .25s;
  }
  .toggle .knob{
    position:absolute; top:3px; left:3px;
    width:21px; height:21px; border-radius:50%;
    background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.25);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .toggle.on{background:var(--ok);}
  .toggle.on .knob{transform:translateX(19px);}
  .toggle.off{background:var(--danger);}
  .toggle.off .knob{transform:translateX(0);}

  /* ---------- BOTTOM ACTION BAR ---------- */
  .action-bar{
    flex-shrink:0;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(255,255,255,.9) 25%, #fff 100%);
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:13px 10px;
    border-radius:16px;
    font-family:'Sora',sans-serif; font-weight:700; font-size:12.5px;
    border:none; cursor:pointer;
    transition:transform .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-yape{ background:linear-gradient(135deg, var(--yape-purple-2), var(--yape-purple)); color:#fff; }
  .btn-wa{ background:#25D366; color:#fff; }
  
  .home-indicator{
    width:120px; height:4px; border-radius:3px; background:rgba(0,0,0,.25);
    margin:0 auto 6px;
  }

  .toast{
    position:absolute; left:50%; bottom:96px; transform:translate(-50%,20px);
    background:var(--ink); color:#fff; font-family:'Inter',sans-serif; font-size:12.5px;
    padding:10px 16px; border-radius:12px;
    opacity:0; pointer-events:none; transition:.3s;
    white-space:nowrap; z-index:80;
    box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .credit{
    text-align:center; margin-top:8px; color:#6D5A8E; font-family:'Inter',sans-serif; font-size:12px;
  }

  /* ---------- MODAL ADMIN ---------- */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(11,5,18,.7);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; flex-direction:column;
    z-index:100; padding:0; overflow:hidden;
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-card{
    background:#fff; border-radius:0 0 24px 24px; width:100%; flex:1; min-height:0;
    display:flex; flex-direction:column;
    box-shadow:0 24px 48px rgba(0,0,0,.4); overflow:hidden;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:max(16px,env(safe-area-inset-top,16px)) 20px 12px; border-bottom:1px solid rgba(0,0,0,.06);
    flex-shrink:0;
  }
  .modal-header h3{
    font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:var(--ink); margin:0;
  }
  .modal-close{
    width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(0,0,0,.06); cursor:pointer; display:flex;
    align-items:center; justify-content:center; font-size:18px; color:#666;
  }
  .modal-tabs{display:flex;padding:0 20px;border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0;}
  .modal-tab{
    padding:10px 16px; font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
    color:#8A7AAE; border:none; background:none; cursor:pointer;
    border-bottom:2px solid transparent; transition:all .2s;
  }
  .modal-tab.active{color:var(--yape-purple);border-bottom-color:var(--yape-purple);font-weight:600;}
  .modal-body{flex:1;overflow-y:auto;padding:0;scrollbar-width:thin;min-height:0;}
  .admin-form{
    position:sticky; top:0; z-index:10;
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:0;
    padding:12px 12px 8px; background:var(--paper); border-radius:0;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .admin-form .full{grid-column:1/-1;}
  .admin-form label{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    color:#6D5A8E; display:block; margin-bottom:3px;
  }
  .admin-form input{
    width:100%; padding:8px 10px; border:1.5px solid rgba(0,0,0,.1);
    border-radius:10px; font-family:'Inter',sans-serif; font-size:13px;
    background:#fff; outline:none; transition:border-color .2s; box-sizing:border-box;
  }
  .admin-form input:focus{border-color:var(--yape-purple);}
  .admin-form .btn-row{grid-column:1/-1;display:flex;gap:8px;margin-top:4px;}
  .admin-form .btn-add{
    flex:1; padding:9px; border:none; border-radius:10px;
    font-family:'Sora',sans-serif; font-weight:700; font-size:12px;
    background:var(--yape-purple); color:#fff; cursor:pointer; transition:opacity .2s;
  }
  .admin-form .btn-add:hover{opacity:.85;}
  .admin-form .btn-cancel{
    padding:9px 14px; border:none; border-radius:10px;
    font-family:'Sora',sans-serif; font-weight:600; font-size:12px;
    background:rgba(0,0,0,.06); color:#666; cursor:pointer; display:none;
  }
  .admin-form .btn-cancel.show{display:block;}
  .admin-list{display:flex;flex-direction:column;gap:6px;padding:8px 16px 20px;}
  .admin-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    border-radius:12px; background:var(--paper);
  }
  .admin-item .info{flex:1;min-width:0;}
  .admin-item .info .name{font-family:'Sora',sans-serif;font-weight:600;font-size:13px;color:var(--ink);}
  .admin-item .info .meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A7AAE;margin-top:1px;}
  .admin-item .actions{display:flex;gap:4px;flex-shrink:0;}
  .admin-item .actions button{
    width:30px;height:30px;border-radius:8px;border:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .btn-edit{background:rgba(91,31,140,.1);color:var(--yape-purple);}
  .btn-del{background:rgba(226,76,76,.1);color:var(--danger);}
  .config-section{display:flex;flex-direction:column;gap:10px;padding:16px 16px 20px;}
  .config-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:12px; background:var(--paper);
  }
  .config-item .tab-label{font-family:'Sora',sans-serif;font-weight:600;font-size:13px;color:var(--ink);min-width:70px;}
  .config-item .fields{display:flex;gap:8px;flex:1;align-items:center;flex-wrap:wrap;}
  .config-item .fields label{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:#6D5A8E;}
  .config-item .fields input{
    width:65px; padding:6px 8px; border:1.5px solid rgba(0,0,0,.1);
    border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12px;
    outline:none; box-sizing:border-box;
  }
  .config-item .fields input:focus{border-color:var(--yape-purple);}
  .modal-empty{text-align:center;padding:48px 16px;color:#8A7AAE;font-size:13px;}
  .admin-mobile-btn{background:rgba(91,31,140,.15)!important;color:var(--yape-purple)!important;}

  @media(max-width:500px){
    html,body{height:auto;min-height:100vh;min-height:100dvh}
    body{padding:0;justify-content:flex-start;background:#0B0512;background-image:none}
    .main-container{gap:0;width:100%;min-height:100vh;min-height:100dvh}
    .tabs-container{max-width:100%;padding:8px 12px;background:#0B0512}
    .tab-btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15);font-size:11px;padding:5px 12px}
    .tab-btn.active{background:var(--gold);color:#1A0F26;border-color:var(--gold)}
    .device{all:unset;display:flex;flex-direction:column;flex:1;width:100%;overflow:hidden}
    .screen{all:unset;display:flex;flex-direction:column;flex:1;position:relative}
    .modal-overlay{position:fixed;}
    .notch{display:none}
    .statusbar{display:none}

    /* --- Top: dark background --- */
    .app{background:#0B0512}
    .app-topbar{padding:8px 16px 4px}
    .app-title{color:#fff}
    .app-title .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(61,214,140,.25)}
    .topbar-actions{gap:4px}
    .excel-btn-label,.export-btn{font-size:10px;padding:5px 8px;border-radius:10px}
    .excel-btn-label{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85)}
    .export-btn{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
    .bill-card{margin:6px 12px 8px;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#2E6B3E,#1F4B2B)}
    .bill-name{font-size:17px;color:#fff}
    .bill-amount{font-size:28px}

    /* --- List area: white background, same width as bill-card --- */
    #upcomingBanner{margin:0 12px!important;padding:8px 14px!important;font-size:11px;background:#0B0512!important;color:#fff!important;border-right:3px solid var(--gold)!important;border-radius:8px}
    #upcomingBanner span{color:#fff!important}
    #upcomingWaBtn{background:var(--gold)!important;color:#2A1B03!important}
    .list-head{background:#fff;margin:0 12px;padding:16px 14px 4px;border-radius:20px 20px 0 0}
    .list-head h2{color:var(--ink)}
    .list{background:#fff;margin:0 12px;padding:0 14px 8px;max-height:none;overflow-y:visible}
    .row{gap:8px;padding:6px}
    .row.birthday-highlight{padding:10px 8px}
    .avatar{width:36px;height:36px;font-size:12px}
    .row-name{font-size:13px;color:var(--ink)}
    .row-meta{font-size:10px;color:#8A7AAE}
    .action-bar{background:#fff;margin:0 12px;padding:4px 14px calc(8px + env(safe-area-inset-bottom,8px));gap:8px;border-radius:0 0 20px 20px}
    .btn{padding:11px 8px;font-size:11px;border-radius:14px}
    .btn .num{font-size:14px;font-weight:800}
    .toast{bottom:80px}
    .home-indicator{display:none}
    .credit{display:none}
  }
</style>
</head>
<body>

<div class="main-container">
  <div class="tabs-container" id="tabsContainer"></div>

  <div class="device">
    <div class="screen" id="captureTarget">
      <div class="notch"></div>

      <div class="statusbar">
        <span id="clock">9:41</span>
        <div class="icons">

<script>
const YAPE_NUM = "975626524";
const AMOUNT_PER = 20;

let excelTabsData = {};
let currentTab = "";
let excelFileHandle = null;
let otrosData = null;
let saving = false;
let tabConfig = {};

const SERVER_PORT = 8765;

async function serverSave(data) {
  await fetch(`http://localhost:${SERVER_PORT}/api/save`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({data}) });
}

const palette = ["#5B1F8C","#00A99D","#D9A63C","#E24C4C","#2E6B3E","#7E2FBF"];
const initials = s => s.slice(0,2).toUpperCase();
const colorFor = i => palette[i % palette.length];

const listEl = document.getElementById('list');
const tabsContainer = document.getElementById('tabsContainer');

function renderTabs() {
  tabsContainer.innerHTML = "";
  Object.keys(excelTabsData).forEach(tabName => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${tabName === currentTab ? 'active' : ''}`;
    btn.textContent = tabName;
    btn.addEventListener('click', () => {
      currentTab = tabName;
      renderTabs();
      render();
      updateSummary();
    });
    tabsContainer.appendChild(btn);
  });
}

function render(){
  listEl.innerHTML = "";
  const people = excelTabsData[currentTab] || [];

  // Buscar si hay alguien en estado 0 (Cumpleaños) en la pestaña activa
  const birthdayPerson = people.find(p => parseInt(p.state) === 0);
  const birthdayTitleEl = document.getElementById('birthdayTitle');
  if (birthdayPerson) {
    birthdayTitleEl.innerHTML = `${birthdayPerson.n} 🎂`;
  } else {
    birthdayTitleEl.innerHTML = `Sin cumples 🎈`;
  }

  const bdayPerson = people.find(p => parseInt(p.state) === 0);
  const daysSinceBDay = bdayPerson ? daysSinceLastBDay(bdayPerson.d) : 0;

  people.forEach((p, i) => {
    const stateNum = parseInt(p.state); // 0: Cumpleaños, 1: Pagó, 2: No Pagó
    const row = document.createElement('div');
    
    // Clases según estados e indicadores visuales requeridos
    let stateClass = `state-${stateNum}`;
    let highlightClass = (stateNum === 0) ? 'birthday-highlight' : '';
    row.className = `row ${stateClass} ${highlightClass}`;
    
    let rightSideContent = '';
    if (stateNum === 0) {
      // Estado 0: Cumpleaños (Icono bloqueado/Corona)
      rightSideContent = `
        <span class="amt">Recibe</span>
        <div class="lock" title="Cumpleañero">
          <svg width="12" height="13" viewBox="0 0 12 13" fill="none"><rect x="1.5" y="5.5" width="9" height="6.5" rx="1.5" fill="currentColor"/><path d="M3.5 5.5V3.7A2.5 2.5 0 0 1 6 1.2a2.5 2.5 0 0 1 2.5 2.5V5.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
        </div>`;
    } else {
      const moraPD = (tabConfig[currentTab]?.moraPorDia) || 0;
      const amt = stateNum === 1
        ? (p.cuota || 0) + (p.mora || 0)
        : (p.cuota || 0) + moraPD * daysSinceBDay;
      rightSideContent = `
        <span class="amt">S/${amt}</span>
        <button class="toggle ${stateNum === 1 ? 'on':'off'}" data-i="${i}" aria-label="Cambiar estado de ${p.n}"><span class="knob"></span></button>`;
    }

    row.innerHTML = `
      ${stateNum === 0 ? '<span class="crown">👑</span>' : ''}
      <div class="avatar" style="background:${colorFor(i)}">
        ${initials(p.n)}
        ${stateNum === 0 ? '<span class="gift">🎁</span>' : ''}
      </div>
      <div class="row-mid">
        <div class="row-name">${p.n} ${stateNum === 0 ? '<span class="pill">CUMPLE</span>':''}</div>
        <div class="row-meta">${p.d} · ${p.tel || 'S/N'}</div>
      </div>
      <div class="row-right">
        ${rightSideContent}
      </div>
    `;
    listEl.appendChild(row);
  });

  // Single click: alterna entre pagó (1) y no pagó (2)
  // Doble click: marca como cumpleañero (0), muestra "Recibe" y bloquea el switch
  listEl.querySelectorAll('.toggle').forEach(btn=>{
    let clickTimer = null;
    btn.addEventListener('click', ()=>{
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
        // Doble click → estado 0 (cumpleañero)
        const i = +btn.dataset.i;
        const person = excelTabsData[currentTab][i];
        person.state = 0;
        person.mora = 0;
        render();
        updateSummary();
        saveExcel();
        return;
      }
      clickTimer = setTimeout(()=>{
        clickTimer = null;
        const i = +btn.dataset.i;
        const target = excelTabsData[currentTab][i];
        const wasPending = target.state == 2;
        if (target.state == 2) {
          const moraPD = (tabConfig[currentTab]?.moraPorDia) || 0;
          const bp = (excelTabsData[currentTab] || []).find(x => parseInt(x.state) === 0);
          const days = bp ? daysSinceLastBDay(bp.d) : 0;
          target.mora = moraPD * days;
          target.state = 1;
        } else {
          target.state = 2;
        }
        render();
        updateSummary();
        saveExcel();
        // Si era el último pendiente que recién pagó → enviar mensaje
        if (wasPending && target.state == 1) {
          const people = excelTabsData[currentTab] || [];
          const pending = people.filter(p => parseInt(p.state) === 2);
          if (pending.length === 0) sendMissionComplete();
        }
      }, 300);
    });
  });

  // Doble click en el candado (estado 0) para revertir a no pagó (2)
  listEl.querySelectorAll('.lock').forEach(lock=>{
    let lockTimer = null;
    lock.addEventListener('click', ()=>{
      if (lockTimer) {
        clearTimeout(lockTimer);
        lockTimer = null;
        const row = lock.closest('.row');
        const i = [...row.parentNode.children].indexOf(row);
        const target = excelTabsData[currentTab];
        if (target[i]) { target[i].state = 2; target[i].mora = 0; }
        render();
        updateSummary();
        saveExcel();
        return;
      }
      lockTimer = setTimeout(()=>{ lockTimer = null; }, 300);
    });
  });
  checkUpcoming();
}

async function saveExcel() {
  if (saving || Object.keys(excelTabsData).length === 0) return;
  saving = true;

  const wb = XLSX.utils.book_new();
  for (const [sheetName, people] of Object.entries(excelTabsData)) {
    const header = ['Cuota', 'Mora', 'Telefono', 'Nombre', 'Fecha', 'Estado'];
    const data = [header];
    people.forEach(p => {
      data.push([p.cuota || 0, p.mora || 0, p.tel || '', p.n, p.d, p.state]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), sheetName);
  }
  if (otrosData && otrosData.length > 0) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(otrosData), 'otros');
  }

  const wbArray = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });

  if (excelFileHandle) {
    try {
      const writable = await excelFileHandle.createWritable();
      await writable.write(wbArray);
      await writable.close();
      saving = false;
      return;
    } catch (e) {
      console.warn('File handle save failed, trying alternatives', e);
    }
  }

  try {
    await serverSave(XLSX.write(wb, { type: 'base64', bookType: 'xlsx' }));
    saving = false;
    return;
  } catch {}

  const blob = new Blob([wbArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Cumple.xlsx';
  a.click();
  URL.revokeObjectURL(a.href);
  saving = false;
}

function calcPersonAmount(p) {
  const moraPD = (tabConfig[currentTab]?.moraPorDia) || 0;
  if (parseInt(p.state) === 1) return (p.cuota || 0) + (p.mora || 0);
  if (parseInt(p.state) === 2) {
    const bp = (excelTabsData[currentTab] || []).find(x => parseInt(x.state) === 0);
    const days = bp ? daysSinceLastBDay(bp.d) : 0;
    return (p.cuota || 0) + moraPD * days;
  }
  return 0;
}

function updateSummary(){
  const people = excelTabsData[currentTab] || [];
  const validPayers = people.filter(p => parseInt(p.state) !== 0);
  
  const goalCount = validPayers.length;
  const collectedAmount = validPayers.filter(p => parseInt(p.state) === 1).reduce((sum, p) => sum + calcPersonAmount(p), 0);
  const goalAmount = validPayers.reduce((sum, p) => sum + calcPersonAmount(p), 0);
  const pct = goalAmount > 0 ? Math.round((collectedAmount / goalAmount) * 100) : 0;
  const pendingCount = goalCount - validPayers.filter(p => parseInt(p.state) === 1).length;

  document.getElementById('totalAmount').textContent = collectedAmount;
  document.getElementById('statusBadge').textContent = `${validPayers.filter(p => parseInt(p.state) === 1).length}/${goalCount} pagaron`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('pctLabel').textContent = `${pct}% recaudado`;
  document.getElementById('pendingLabel').textContent = pendingCount === 0 ? '¡Completo! 🎉' : `${pendingCount} pendiente${pendingCount > 1 ? 's' : ''}`;
  document.getElementById('peopleCount').textContent = `${people.length} personas`;
}

// --- PROCESAMIENTO DEL WORKBOOK (extraído para reuso) ---
function processWorkbook(data, dataType) {
  const workbook = XLSX.read(data, {type: dataType || 'array', cellDates: true, raw: false});

  const headerKeywords = {
    n: ['nombre','name','nombres','names','integrante','integrantes','persona','personas','colaborador','miembro','participante'],
    d: ['fecha','date','cumpleaños','cumple','birthday','nacimiento','día','dia','nac'],
    state: ['estado','state','status','pagó','pago','pagado','paid','situación','situacion','yapeó','yapeo'],
    tel: ['teléfono','telefono','tel','telefóno','celular','cel','whatsapp','wa','contacto','número','numero','celular','móvil','movil'],
    cuota: ['cuota','monto','aporte','contribucion','contribución'],
    mora: ['mora','morosidad','penalidad','recargo','interes','interés']
  };

  function detectCols(rows, maxScan) {
    for (let r = 0; r < Math.min(maxScan || 5, rows.length); r++) {
      const row = rows[r];
      if (!row || !Array.isArray(row)) continue;
      const vals = row.map(v => String(v || '').toLowerCase().trim());
      let found = {n:false, d:false, state:false, tel:false, cuota:false, mora:false};
      const map = {};
      vals.forEach((v, ci) => {
        for (const [key, keywords] of Object.entries(headerKeywords)) {
          if (keywords.some(kw => v.includes(kw) || v === kw)) {
            if (!found[key]) { map[key] = ci; found[key] = true; }
          }
        }
      });
      if (found.n) {
        if (!found.d) map.d = -1;
        if (!found.state) map.state = -1;
        if (!found.tel) map.tel = -1;
        if (!found.cuota) map.cuota = -1;
        if (!found.mora) map.mora = -1;
        return { headIdx: r + 1, colMap: map };
      }
    }
    return null;
  }

  const fallbacks = [
    {n:0, d:1, state:2, tel:3, cuota:0, mora:1},
    {n:1, d:2, state:3, tel:4, cuota:0, mora:1},
    {n:0, d:2, state:3, tel:4, cuota:0, mora:1},
    {n:1, d:0, state:2, tel:3, cuota:-1, mora:-1},
  ];

  function fmtDate(v) {
    if (v == null || v === '') return 'S/F';
    if (v instanceof Date && !isNaN(v)) {
      return v.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
    }
    if (typeof v === 'number') {
      const d = new Date(Date.UTC(1899, 11, 30 + Math.floor(v)));
      if (!isNaN(d)) return d.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
    }
    return String(v).trim();
  }

  function parseNum(v) {
    if (v === undefined || v === null) return 0;
    if (typeof v === 'number') return v;
    const s = String(v).replace(/[^0-9.,]/g, '').replace(',', '.');
    return parseFloat(s) || 0;
  }

  let newTabsData = {};
  let validTabFound = false;
  tabConfig = {};

  workbook.SheetNames.forEach(sheetName => {
    const worksheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

    if (sheetName.trim().toLowerCase() === "otros") {
      otrosData = rows;
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || !Array.isArray(row) || !row[0]) continue;
        const name = String(row[0]).trim();
        const cuota = parseFloat(row[1]) || 0;
        const moraPD = parseFloat(row[2]) || 0;
        if (name) tabConfig[name] = { cuota, moraPorDia: moraPD };
      }
      return;
    }

    if (!rows || rows.length < 1) return;

    let headIdx = 0;
    let colMap = null;

    const detected = detectCols(rows, 5);
    if (detected) {
      headIdx = detected.headIdx;
      colMap = detected.colMap;
    } else {
      for (const fb of fallbacks) {
        const test = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !Array.isArray(r)) continue;
          const name = r[fb.n];
          if (name && String(name).trim()) test.push(name);
        }
        if (test.length > 0) {
          headIdx = 1;
          colMap = fb;
          break;
        }
      }
      if (!colMap) {
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !Array.isArray(r)) continue;
          for (let c = 0; c < Math.min(6, r.length); c++) {
            if (r[c] && String(r[c]).trim()) {
              headIdx = i;
              colMap = {n: c, d: c+1 >= 0 ? c+1 : -1, state: c+2, tel: c+3, cuota: c >= 0 ? c : -1, mora: -1};
              break;
            }
          }
          if (colMap) break;
        }
        if (!colMap) return;
      }
    }

    const parsedPeople = [];
    for (let i = headIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row || !Array.isArray(row)) continue;
      const name = row[colMap.n];
      if (!name || !String(name).trim()) continue;

      const cuota = colMap.cuota >= 0 ? parseNum(row[colMap.cuota]) : 0;
      const mora = colMap.mora >= 0 ? parseNum(row[colMap.mora]) : 0;

      parsedPeople.push({
        n: String(name).trim(),
        d: colMap.d >= 0 && row[colMap.d] != null ? fmtDate(row[colMap.d]) : "S/F",
        state: colMap.state >= 0 && row[colMap.state] !== undefined ? parseInt(row[colMap.state]) : 2,
        tel: colMap.tel >= 0 && row[colMap.tel] ? String(row[colMap.tel]).trim() : "",
        cuota,
        mora,
        amount: cuota + mora
      });
    }

    if (parsedPeople.length > 0) {
      sortByMD(parsedPeople);
      newTabsData[sheetName] = parsedPeople;
      if (!validTabFound) {
        currentTab = sheetName;
        validTabFound = true;
      }
    }
  });

  if (validTabFound) {
    excelTabsData = newTabsData;
    renderTabs();
    render();
    updateSummary();
    checkUpcoming();
    showToast("¡Pestañas cargadas con éxito! 🚀");
  } else {
    showToast("No se encontraron registros válidos en el archivo.");
  }
}



async function openExcel() {
  try {
    const [handle] = await window.showOpenFilePicker({
      id: 'cumple-excel',
      types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }],
      multiple: false,
    });
    excelFileHandle = handle;
    const file = await handle.getFile();
    const reader = new FileReader();
    reader.onload = function(e) { processWorkbook(new Uint8Array(e.target.result)); };
    reader.readAsArrayBuffer(file);
  } catch (err) {
    if (err.name === 'AbortError') return;
    document.getElementById('excelFile').click();
  }
}

async function initApp() {
  try {
    const resp = await fetch(`http://localhost:${SERVER_PORT}/api/read`);

      const json = await resp.json();
      if (json.ok && json.data) {

}

function formatDateShort(dateStr) {
  if (!dateStr || dateStr === 'S/F') return '';
  const parts = dateStr.split('/');
  if (parts.length !== 3) return dateStr;
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return parseInt(parts[0]) + ' ' + months[parseInt(parts[1]) - 1];
}

function daysUntilBDay(dateStr) {
  if (!dateStr || dateStr === 'S/F') return null;
  const parts = dateStr.split('/');
  if (parts.length !== 3) return null;
  const today = new Date();
  const bday = new Date(today.getFullYear(), +parts[1] - 1, +parts[0]);
  if (bday < today) bday.setFullYear(bday.getFullYear() + 1);
  return Math.ceil((bday - today) / (1000 * 60 * 60 * 24));
}

function daysSinceLastBDay(dateStr) {
  if (!dateStr || dateStr === 'S/F') return 0;
  const parts = dateStr.split('/');
  if (parts.length !== 3) return 0;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const bday = new Date(today.getFullYear(), +parts[1] - 1, +parts[0]);
  bday.setHours(0, 0, 0, 0);
  if (bday > today) return 0;
  return Math.floor((today - bday) / (1000 * 60 * 60 * 24));
}

function checkUpcoming() {
  const people = excelTabsData[currentTab] || [];
  let minDays = Infinity;
  const upcoming = people.filter(p => {
    const d = daysUntilBDay(p.d);
    if (d !== null && d < minDays) minDays = d;
    return d !== null;
  });
  const banner = document.getElementById('upcomingBanner');
  const namesEl = document.getElementById('upcomingNames');
  if (upcoming.length === 0 || minDays === Infinity) {
    banner.style.display = 'none';
    return;
  }
  const next = upcoming.filter(p => daysUntilBDay(p.d) === minDays);
  banner.style.display = 'flex';
  namesEl.innerHTML = next.map(p =>
    `<span style="display:inline-block;vertical-align:top">${p.n}<span style="display:block;font-size:11px;opacity:.7;font-weight:400">${formatDateShort(p.d)}</span></span>`
  ).join('<span style="margin:0 4px">, </span>');
}

// --- ADMIN / CRUD ---
let editingIndex = null;

function parseMD(s) {
  if (!s || s === 'S/F') return { d: 99, m: 99 };
  const p = s.split('/');
  return { d: parseInt(p[0]) || 99, m: parseInt(p[1]) || 99 };
}
function sortByMD(arr) {
  arr.sort((a, b) => {
    const ma = parseMD(a.d), mb = parseMD(b.d);
    return ma.m !== mb.m ? ma.m - mb.m : ma.d - mb.d;
  });
}

function openAdminModal() {
  if (!currentTab || !excelTabsData[currentTab] || !excelTabsData[currentTab].length) {
    showToast('Primero carga un archivo Excel');
    return;
  }
  document.body.style.overflow = 'hidden';
  document.getElementById('adminModal').classList.add('open');
  editingIndex = null;
  switchAdminTab('people');
}

function closeAdminModal() {
  document.body.style.overflow = '';
  document.getElementById('adminModal').classList.remove('open');
}

function switchAdminTab(tab) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('adminPeopleTab').style.display = tab === 'people' ? 'block' : 'none';
  document.getElementById('adminConfigTab').style.display = tab === 'config' ? 'block' : 'none';
  if (tab === 'people') renderAdminPeople();
  else renderAdminConfig();
}

function renderAdminPeople() {
  const people = excelTabsData[currentTab] || [];
  const container = document.getElementById('adminPeopleList');
  if (!people.length) {
    container.innerHTML = '<div class="modal-empty">No hay personas en esta pestaña</div>';
    return;
  }
  container.innerHTML = people.map((p, i) => `
    <div class="admin-item">
      <div class="info">
        <div class="name">${p.n}</div>
        <div class="meta">${p.d} · ${p.tel || 'S/N'} · S/${p.cuota || 0}</div>
      </div>
      <div class="actions">
        <button class="btn-edit" onclick="editPerson(${i})" title="Editar">✎</button>
        <button class="btn-del" onclick="deletePerson(${i})" title="Eliminar">✕</button>
      </div>
    </div>
  `).join('');
}

function renderAdminConfig() {
  const container = document.getElementById('adminConfigList');
  const tabs = Object.keys(excelTabsData);
  if (!tabs.length) {
    container.innerHTML = '<div class="modal-empty">No hay pestañas cargadas</div>';
    return;
  }
  container.innerHTML = tabs.map((tab, idx) => {
    const cfg = tabConfig[tab] || { cuota: 20, moraPorDia: 0 };
    return `
      <div class="config-item">
        <span class="tab-label">${tab.replace(/</g,'&lt;')}</span>
        <div class="fields">
          <label>Cuota S/</label>
          <input type="number" step="0.5" min="0" value="${cfg.cuota}" data-idx="${idx}" data-field="cuota" class="cfg-input">
          <label>Mora</label>
          <input type="number" step="0.5" min="0" value="${cfg.moraPorDia}" data-idx="${idx}" data-field="moraPorDia" class="cfg-input">
        </div>
      </div>
    `;
  }).join('');
}

function resetForm() {
  document.getElementById('adminForm').reset();
  document.getElementById('fCuota').value = '0';
  document.getElementById('fMora').value = '0';
  document.getElementById('fState').value = '2';
  document.getElementById('adminFormCancel').classList.remove('show');
  document.getElementById('adminFormSubmit').textContent = 'Añadir';
  editingIndex = null;
}

function fillForm(p) {
  document.getElementById('fName').value = p.n || '';
  document.getElementById('fDate').value = p.d || '';
  document.getElementById('fPhone').value = p.tel || '';
  document.getElementById('fCuota').value = p.cuota || 0;
  document.getElementById('fMora').value = p.mora || 0;
  document.getElementById('fState').value = p.state || 2;
}

function submitPerson(e) {
  e.preventDefault();
  const n = document.getElementById('fName').value.trim();
  if (!n) { showToast('El nombre es obligatorio'); return; }
  const data = {
    n,
    d: document.getElementById('fDate').value.trim(),
    tel: document.getElementById('fPhone').value.trim(),
    cuota: parseFloat(document.getElementById('fCuota').value) || 0,
    mora: parseFloat(document.getElementById('fMora').value) || 0,
    state: parseInt(document.getElementById('fState').value) || 2,
    amount: 0
  };
  if (editingIndex !== null) {
    excelTabsData[currentTab][editingIndex] = data;
  } else {
    excelTabsData[currentTab].push(data);
  }
  sortByMD(excelTabsData[currentTab]);
  resetForm();
  render();
  updateSummary();
  renderAdminPeople();
  saveExcel();
  showToast(editingIndex !== null ? 'Actualizado ✓' : 'Añadido ✓');
}

function editPerson(i) {
  const p = excelTabsData[currentTab][i];
  if (!p) return;
  editingIndex = i;
  fillForm(p);
  document.getElementById('adminFormCancel').classList.add('show');
  document.getElementById('adminFormSubmit').textContent = 'Actualizar';
  document.getElementById('adminForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deletePerson(i) {
  if (!confirm('¿Eliminar esta persona?')) return;
  excelTabsData[currentTab].splice(i, 1);
  sortByMD(excelTabsData[currentTab]);
  render();
  updateSummary();
  renderAdminPeople();
  saveExcel();
  showToast('Eliminado ✓');
}

document.getElementById('adminBtn').addEventListener('click', openAdminModal);
document.getElementById('adminClose').addEventListener('click', closeAdminModal);
document.getElementById('adminForm').addEventListener('submit', submitPerson);
document.getElementById('adminFormCancel').addEventListener('click', resetForm);
document.getElementById('adminModal').addEventListener('click', function(e) { if (e.target === this) closeAdminModal(); });
document.querySelectorAll('.modal-tab').forEach(tab => {
  tab.addEventListener('click', () => switchAdminTab(tab.dataset.tab));
});
document.getElementById('adminConfigList').addEventListener('change', function(e) {
  if (e.target.classList.contains('cfg-input')) {
    const idx = parseInt(e.target.dataset.idx);
    const field = e.target.dataset.field;
    const tab = Object.keys(excelTabsData)[idx];
    if (tab) {
      if (!tabConfig[tab]) tabConfig[tab] = { cuota: 20, moraPorDia: 0 };
      tabConfig[tab][field] = parseFloat(e.target.value) || 0;
    }
  }
});
document.getElementById('saveConfigBtn').addEventListener('click', function() {
  otrosData = [['Tab', 'Cuota', 'Mora/Dia']];
  for (const [tab, cfg] of Object.entries(tabConfig)) {
    otrosData.push([tab, cfg.cuota, cfg.moraPorDia]);
  }
  render();
  updateSummary();
  saveExcel();
  showToast('Configuración guardada ✓');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
