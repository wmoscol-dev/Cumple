<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CumpliYape &#xB7; Control de Recaudo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C3CE0">
<meta name="description" content="Control de recaudo para cumplea&#xF1;os v&#xED;a Yape">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CumpliYape">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  :root{
    --purple:#6C3CE0;
    --purple-2:#8B5CF6;
    --purple-deep:#4A2899;
    --purple-light:#EDE6FB;
    --green:#1FAE59;
    --green-light:#DCFCE7;
    --green-text:#15803D;
    --red:#EF4444;
    --red-light:#FEE2E2;
    --red-text:#C81E1E;
    --gold:#F5A623;
    --pink:#F472B6;
    --ink:#221933;
    --muted:#8A7AAE;
    --paper:#F8F6FD;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#0B0512;
    font-family:'Inter',sans-serif;
    padding:32px 16px;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
  }

  /* ---------- FONDO ANIMADO (aurora + orbes) ---------- */
  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.5;
    will-change:transform;
  }
  .aurora span:nth-child(1){
    width:480px; height:480px; top:-160px; left:-140px;
    background:radial-gradient(circle, var(--purple-2), transparent 70%);
    animation:auroraFloat1 16s ease-in-out infinite;
  }
  .aurora span:nth-child(2){
    width:420px; height:420px; bottom:-140px; right:-120px;
    background:radial-gradient(circle, var(--green), transparent 70%);
    animation:auroraFloat2 20s ease-in-out infinite;
  }
  .aurora span:nth-child(3){
    width:360px; height:360px; top:40%; left:50%;
    background:radial-gradient(circle, var(--gold), transparent 70%);
    opacity:.25;
    animation:auroraFloat3 24s ease-in-out infinite;
  }
  @keyframes auroraFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.15)}}
  @keyframes auroraFloat2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-40px) scale(1.1)}}
  @keyframes auroraFloat3{0%,100%{transform:translate(-50%,-40%) scale(1)}50%{transform:translate(-50%,-60%) scale(1.25)}}

  .sparkles{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .sparkles i{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,255,255,.55); animation:sparkleTwinkle 3.5s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle{0%,100%{opacity:0; transform:scale(.5)}50%{opacity:1; transform:scale(1.3)}}

  /* ---------- CONTENEDOR PRINCIPAL ---------- */
  .main-container {
    position:relative; z-index:1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ---------- PHONE FRAME ---------- */
  .device{
    position:relative;
    width:390px;
    max-width:94vw;
    height:820px;
    background:linear-gradient(155deg,#2b2b2f,#0a0a0c 60%);
    border-radius:56px;
    padding:14px;
    box-shadow:
      0 60px 120px -30px rgba(108,60,224,.45),
      0 20px 40px -10px rgba(0,0,0,.6),
      inset 0 0 0 2px rgba(255,255,255,.04);
  }
  .screen{
    position:relative;
    width:100%; height:100%;
    background:var(--paper);
    border-radius:42px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  }

  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:118px; height:32px; background:#0a0a0c;
    border-radius:0 0 20px 20px;
    z-index:50;
  }
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px 4px;
    font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px;
    color:var(--ink);
    flex-shrink:0;
    background:transparent;
  }
  .statusbar .icons{display:flex; align-items:center; gap:5px;}

  /* ---------- APP HEADER ---------- */
  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-top: 4px;
  }
  .app-title-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 16px 2px;
  }
  .app-title{
    font-family:'Sora',sans-serif; font-weight:800; font-size:17px;
    color:var(--purple); letter-spacing:.1px;
    display:flex; align-items:center; gap:6px;
  }
  .app-title .cake{font-size:18px;}

  .topbar-actions{display:flex; gap:8px;}
  #excelFile{display:none;}
  .ico{width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:none; background:var(--purple-light); color:var(--purple);
    cursor:pointer; position:relative; transition:background .2s, transform .15s;
  }
  .icon-btn:hover{background:#E2D3FA;}
  .icon-btn:active{transform:scale(.9);}
  .icon-btn .dot-badge{
    position:absolute; top:3px; right:4px; width:9px; height:9px; border-radius:50%;
    background:var(--red); box-shadow:0 0 0 2px #fff; display:none;
    animation:dotBadgePulse 1.6s ease-in-out infinite;
  }
  .icon-btn.has-pending .dot-badge{display:block;}
  @keyframes dotBadgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  /* ---------- TABS ---------- */
  .tabs-container{
    display:flex; gap:6px; overflow-x:auto; padding:8px 14px 10px;
    scrollbar-width:none; border-bottom:1px solid rgba(108,60,224,.1);
    margin:0 2px;
  }
  .tabs-container::-webkit-scrollbar{display:none;}
  .tab-btn{
    background:transparent; color:var(--muted); border:none; border-radius:12px;
    padding:7px 14px; font-family:'Sora',sans-serif; font-size:12.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; transform:scale(1);
    transition:background .2s, color .2s, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-btn:hover{background:rgba(108,60,224,.07);}
  .tab-btn.active{background:var(--purple-light); color:var(--purple); transform:scale(1.06);}

  /* ---------- BILL CARD (tarjeta del cumpleanero) ---------- */
  .bill-card{
    margin:12px 16px 6px;
    border-radius:20px;
    padding:16px;
    position:relative;
    overflow:hidden;
    background:var(--purple-light);
    box-shadow:0 10px 26px -14px rgba(108,60,224,.45), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .bill-card::before{
    content:'';
    position:absolute; top:-20%; left:-60%; width:45%; height:140%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.65), transparent);
    transform:skewX(-18deg);
    animation:cardShine 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes cardShine{0%{left:-60%;}45%{left:130%;}100%{left:130%;}}

  .bill-top{display:flex; align-items:center; gap:12px;}

  .bill-photo-ring{position:relative; flex-shrink:0;}
  .bill-photo{
    width:74px; height:74px; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--purple-2); box-shadow:0 0 0 4px #fff, 0 6px 16px -6px rgba(108,60,224,.5);
    font-size:28px;
  }
  .bill-photo img{width:100%; height:100%; object-fit:cover;}
  .photo-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Sora',sans-serif; font-weight:800; font-size:20px;
  }
  .bill-photo-ring .dot{position:absolute; width:8px; height:8px; border-radius:50%; animation:dotFloat 3s ease-in-out infinite;}
  .bill-photo-ring .dot:nth-child(1){top:-4px; left:6px; background:var(--gold); animation-delay:0s;}
  .bill-photo-ring .dot:nth-child(2){top:8px; right:-6px; background:var(--green); animation-delay:.4s;}
  .bill-photo-ring .dot:nth-child(3){bottom:-2px; left:0; background:var(--purple); animation-delay:.8s;}
  .bill-photo-ring .dot:nth-child(4){bottom:14px; right:-6px; background:var(--pink); animation-delay:1.2s;}
  @keyframes dotFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

  /* Columna a la derecha del avatar: cabecera (nombre+monto), barra y etiquetas */
  .bill-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;}
  .bill-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  .bill-info{min-width:0;}
  .bill-name{
    font-family:'Sora',sans-serif; font-weight:800; font-size:18px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1;
  }
  .bill-date{font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); margin-top:2px;}

  .bill-amount-box{display:flex; align-items:baseline; gap:4px; flex-shrink:0;}
  .bill-currency{font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:var(--purple); opacity:.8;}
  .bill-amount{font-family:'Sora',sans-serif; font-weight:800; font-size:30px; color:var(--purple); letter-spacing:-1px; line-height:1;}

  .progress-row{display:flex; align-items:center; gap:8px; margin-top:0;}
  .progress-track{flex:1; height:7px; border-radius:8px; background:rgba(108,60,224,.15); overflow:hidden;}
  .progress-fill{
    height:100%; border-radius:8px; position:relative; overflow:hidden;
    background:linear-gradient(90deg, var(--purple-2), var(--purple));
    box-shadow:0 0 8px rgba(108,60,224,.5);
    transition:width .7s cubic-bezier(.34,1.56,.64,1), background .5s, box-shadow .5s;
  }
  .progress-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
    animation:progressShine 1.8s linear infinite;
  }
  @keyframes progressShine{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .progress-fill.complete{background:linear-gradient(90deg, var(--green), #4ADE80); box-shadow:0 0 12px rgba(31,174,89,.65);}
  .progress-pct{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:var(--purple); white-space:nowrap;}
  .progress-labels{
    display:flex; justify-content:space-between; gap:8px; margin-top:0;
    font-family:'Inter',sans-serif; font-size:11px; color:var(--muted);
  }
  .progress-labels span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- BANNER RECORDATORIO (boton verde) ---------- */
  .reminder-banner{
    display:none; align-items:center; gap:10px; width:calc(100% - 32px);
    margin:8px 16px 0; padding:12px 16px; border:none; border-radius:16px; cursor:pointer;
    background:linear-gradient(135deg, var(--green), #16A34A);
    color:#fff; text-align:left; box-shadow:0 10px 24px -10px rgba(31,174,89,.6);
    transition:transform .15s, box-shadow .2s;
  }
  .reminder-banner:hover{transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(31,174,89,.7);}
  .reminder-banner:active{transform:scale(.98);}
  .reminder-banner .reminder-icon{
    width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .reminder-banner .reminder-text{
    display:flex; flex-direction:column; gap:1px; flex:1; min-width:0;
  }
  .reminder-banner .reminder-label{
    font-family:'Sora',sans-serif; font-size:11px; font-weight:800; letter-spacing:.6px;
    opacity:.9;
  }
  .reminder-banner .reminder-details{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---------- LIST ---------- */
  .list-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 4px;
  }
  .list-head h2{
    margin:0; font-family:'Sora',sans-serif; font-size:12px; font-weight:700;
    color:var(--ink); text-transform:uppercase; letter-spacing:.6px;
  }
  .list-head-right{display:flex; align-items:center; gap:8px;}
  .list-head .count{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
  }
  .gear-btn{
    width:26px; height:26px; border-radius:8px; border:none; background:rgba(108,60,224,.08);
    color:var(--purple); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .4s;
  }
  .gear-btn:hover{background:rgba(108,60,224,.16); transform:rotate(45deg);}

  .list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 12px 90px;
    scrollbar-width:none;
  }
  .list::-webkit-scrollbar{display:none;}

  .row{
    display:flex; align-items:center; gap:10px;
    padding:8px 8px;
    border-radius:16px;
    margin:2px 0;
    transition:background .25s, transform .2s;
    position:relative;
    animation:rowIn .45s cubic-bezier(.22,1,.36,1) backwards;
  }
  .row:hover{background:rgba(108,60,224,.05);}
  @keyframes rowIn{
    from{opacity:0; transform:translateY(10px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* Color de fila segun pago: verde = pago, naranja = pendiente, rojo = pendiente y ya paso el cumpleanos */
  .row.row-paid, .row.row-paid:hover{background:var(--green-light);}
  .row.row-pending, .row.row-pending:hover{background:#FFE9CC;}
  .row.row-overdue, .row.row-overdue:hover{background:var(--red-light);}

  /* Destacar cumpleanero (Estado 0) */
  .row.birthday-highlight{
    background:linear-gradient(90deg, rgba(108,60,224,.14), rgba(108,60,224,.03));
    box-shadow:0 0 0 1.5px var(--purple-2);
    padding:12px 10px;
    margin:8px 2px;
  }
  .row.birthday-highlight .avatar{
    width:46px; height:46px; font-size:15px;
    animation:avatarPulse 2.2s ease-in-out infinite;
  }
  @keyframes avatarPulse{
    0%,100%{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--purple-2);}
    50%{box-shadow:0 0 0 3px #fff, 0 0 0 8px rgba(139,92,246,.5);}
  }
  .crown{
    position:absolute; top:-9px; left:20px; font-size:14px;
    transform:rotate(-14deg);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
    animation:crownFloat 2.4s ease-in-out infinite;
  }
  @keyframes crownFloat{0%,100%{transform:rotate(-14deg);}50%{transform:rotate(-6deg) translateY(-1px);}}

  .avatar{
    width:40px; height:40px; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px;
    color:#fff; flex-shrink:0; position:relative;
  }
  .avatar-img{width:100%; height:100%; object-fit:cover;}
  .row-mid{flex:1; min-width:0;}
  .row-name{
    font-family:'Sora',sans-serif; font-weight:700; font-size:14px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-meta{
    font-family:'Inter',sans-serif; font-size:11px; color:var(--muted);
    margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:5px;
  }
  .row-right{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .amt{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    min-width:32px; text-align:right; color:var(--ink);
  }

  .state-pill{
    width:32px; height:32px; flex-shrink:0; border:none; border-radius:50%;
    font-family:'Sora',sans-serif; font-weight:800; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
    transition:transform .15s, box-shadow .2s;
  }
  .state-pill:active{transform:scale(.88);}
  .state-pill.state-1{
    background:var(--green-light); color:var(--green-text);
    box-shadow:inset 0 0 0 1.5px rgba(31,174,89,.35);
  }
  .state-pill.state-2{
    background:var(--red-light); color:var(--red-text);
    box-shadow:inset 0 0 0 1.5px rgba(239,68,68,.35);
  }
  .state-pill.state-0{
    background:rgba(108,60,224,.06);
    box-shadow:inset 0 0 0 2px rgba(108,60,224,.25);
  }

  .kebab-btn{
    width:24px; height:24px; border-radius:8px; border:none; background:transparent;
    color:var(--muted); font-size:16px; font-weight:700; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:background .2s;
  }
  .kebab-btn:hover{background:rgba(108,60,224,.1); color:var(--purple);}
  .kebab-menu{
    position:absolute; background:#fff; border-radius:12px; overflow:hidden;
    box-shadow:0 12px 30px rgba(34,25,51,.22); z-index:90; min-width:130px;
    animation:menuPop .18s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  @keyframes menuPop{from{opacity:0; transform:scale(.9) translateY(-6px);}to{opacity:1; transform:scale(1) translateY(0);}}
  .kebab-menu button{
    display:block; width:100%; text-align:left; padding:10px 14px; border:none; background:none;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .kebab-menu button:hover{background:var(--purple-light);}
  .kebab-menu button[data-act="del"]{color:var(--red-text);}

  /* ---------- FAB ---------- */
  .fab-add{
    position:absolute; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:60;
    width:52px; height:52px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--purple-2), var(--purple)); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 10px 24px -6px rgba(108,60,224,.55);
    transition:transform .2s;
    animation:fabPulse 2.6s ease-in-out infinite;
  }
  .fab-add:hover{transform:scale(1.06);}
  .fab-add:active{transform:scale(.92);}
  @keyframes fabPulse{
    0%,100%{box-shadow:0 10px 24px -6px rgba(108,60,224,.55);}
    50%{box-shadow:0 12px 30px -4px rgba(108,60,224,.8);}
  }

  /* ---------- BOTTOM ACTION BAR ---------- */
  .action-bar{
    flex-shrink:0;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(255,255,255,.9) 25%, #fff 100%);
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:13px 10px;
    border-radius:16px;
    font-family:'Sora',sans-serif; font-weight:700; font-size:12.5px;
    border:none; cursor:pointer;
    position:relative; overflow:hidden;
    transition:transform .15s, box-shadow .25s;
  }
  .btn:active{transform:scale(.96);}
  .btn::after{

// --- Chispas de fondo ---
(function spawnSparkles(){
  const box = document.getElementById('sparkles');
  if (!box) return;
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    box.appendChild(s);
  }
})();

// --- Animaci\u00F3n de conteo para n\u00FAmeros ---
function animateNumber(el, to) {
  const from = parseFloat(el.dataset.val || el.textContent) || 0;
  to = Math.round(to);
  if (from === to) { el.textContent = to; el.dataset.val = to; return; }
  const duration = 550;
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(step);
    else el.dataset.val = to;
  }
  requestAnimationFrame(step);
}

// --- Confetti de celebraci\u00F3n ---
function launchConfetti() {
  const colors = ['#6C3CE0', '#8B5CF6', '#1FAE59', '#F5A623', '#F472B6', '#EF4444'];
  const container = document.getElementById('captureTarget') || document.body;
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    const size = 5 + Math.random() * 7;
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = colors[i % colors.length];
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const duration = 1800 + Math.random() * 1400;
    const drift = Math.random() * 160 - 80;
    const rotate = Math.random() * 720 - 360;
    const anim = p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${drift}px, 820px) rotate(${rotate}deg)`, opacity: 0 }
    ], { duration, easing: 'cubic-bezier(.25,.46,.45,.94)' });
    container.appendChild(p);
    anim.onfinish = () => p.remove();
    setTimeout(() => p.remove(), duration + 100);
  }
}

// --- Comprimir foto seleccionada a un dataURL peque\u00F1o ---
function fileToCompressedDataURL(file, maxDim, quality) {
  maxDim = maxDim || 160;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updatePhotoPreview(dataUrl) {
  const el = document.getElementById('fFotoPreview');
  el.innerHTML = dataUrl ? `<img src="${dataUrl}" alt="">` : ICON.camera;
}

document.getElementById('fFoto').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    currentPhotoData = await fileToCompressedDataURL(file);
    updatePhotoPreview(currentPhotoData);
  } catch {
    showToast('No se pudo procesar la foto');
  }
});

const SERVER_PORT = 8765;

async function serverSave(data) {
  const resp = await fetch(`http://localhost:${SERVER_PORT}/api/save`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({data}) });
  if (!resp.ok) throw new Error(`Server save failed: ${resp.status}`);
}

const palette = ["#6C3CE0","#1FAE59","#F5A623","#F472B6","#8B5CF6","#4A2899"];

// Escapa texto antes de insertarlo con innerHTML (evita XSS desde el Excel)
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Nombre del grupo de WhatsApp configurado para la pesta\u00F1a activa (hoja otros, columna Grupo)
function currentGrupo() {
  const cfg = tabConfig[currentTab];
  return (cfg && cfg.grupo) ? String(cfg.grupo).trim() : '';
}
// Enlace de invitaci\u00F3n del grupo (hoja otros, columna Enlace)
function currentEnlace() {
  const cfg = tabConfig[currentTab];
  return (cfg && cfg.enlace) ? String(cfg.enlace).trim() : '';
}
// Normaliza un enlace de invitaci\u00F3n de WhatsApp; devuelve '' si no lo es
function waInviteLink(raw) {
  const s = String(raw || '').trim();
  if (!s || !/chat\.whatsapp\.com/i.test(s)) return '';
  return /^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, '');
}
// Limpia un texto para usarlo como nombre de archivo
function safeFileName(s) {
  return String(s || '').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').trim() || 'Recaudo';
}
// Env\u00EDa el aviso: si hay enlace de invitaci\u00F3n, copia el mensaje y abre ESE grupo directo;
// si no, abre el selector de WhatsApp con el mensaje y recuerda el nombre del grupo.
function openWhatsApp(msg) {
  const enlace = waInviteLink(currentEnlace());
  if (enlace) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(msg); } catch (e) {}
    showToast('Mensaje copiado. P\u00E9galo (mantener presionado \u2192 Pegar) en el grupo y env\u00EDa.');
    window.open(enlace, '_blank');
    return;
  }
  const grupo = currentGrupo();
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  if (grupo) showToast('Enviar al grupo: ' + grupo);
}

const listEl = document.getElementById('list');
const tabsContainer = document.getElementById('tabsContainer');

function renderTabs() {
  tabsContainer.innerHTML = "";

    const btn = document.createElement('button');
    btn.className = `tab-btn ${tabName === currentTab ? 'active' : ''}`;

function formatDateLong(dateStr) {
  if (!dateStr || dateStr === 'S/F') return '';
  const parts = dateStr.split('/');
  if (parts.length !== 3) return dateStr;
  const day = parseInt(parts[0]);
  const month = MESES[parseInt(parts[1]) - 1] || '';
  return `${day} de ${month}`;
}

function render(){
  listEl.innerHTML = "";
  const people = excelTabsData[currentTab] || [];

  // Buscar si hay alguien en estado 0 (Cumplea\u00F1os) en la pesta\u00F1a activa
  const birthdayPerson = people.find(p => parseInt(p.state) === 0);
  const titleEl = document.getElementById('birthdayTitle');
  const subtitleEl = document.getElementById('birthdaySubtitle');
  const photoEl = document.getElementById('birthdayPhoto');
  if (birthdayPerson) {
    titleEl.textContent = birthdayPerson.n;
    subtitleEl.textContent = birthdayPerson.d && birthdayPerson.d !== 'S/F' ? birthdayPerson.d : 'Sin fecha registrada';
    photoEl.innerHTML = birthdayPerson.foto
      ? `<img src="${esc(birthdayPerson.foto)}" alt="">`
      : `<div class="photo-fallback" style="background:${colorFor(0)}">${esc(initials(birthdayPerson.n))}</div>`;
  } else {
    titleEl.textContent = `Sin cumples`;
    subtitleEl.textContent = 'Marca a un cumplea\u00F1ero en la lista';
    photoEl.innerHTML = `<div class="photo-fallback" style="background:var(--purple-2)">${ICON.cake}</div>`;
  }

  const daysSinceBDay = birthdayPerson ? daysSinceLastBDay(birthdayPerson.d) : 0;

  people.forEach((p, i) => {
    const stateNum = parseInt(p.state); // 0: Cumplea\u00F1os, 1: Pag\u00F3, 2: No Pag\u00F3
    const row = document.createElement('div');

    let highlightClass = (stateNum === 0) ? 'birthday-highlight' : '';
    // Color de fila: pag\u00F3 = verde; pendiente = naranja; pendiente y ya pas\u00F3 el cumplea\u00F1os = rojo
    const bdayPassed = daysSinceBDay > 0;
    let payClass = '';
    if (stateNum === 1) payClass = 'row-paid';
    else if (stateNum === 2) payClass = bdayPassed ? 'row-overdue' : 'row-pending';
    row.className = `row state-${stateNum} ${highlightClass} ${payClass}`;

    const moraPD = (tabConfig[currentTab]?.moraPorDia) || 0;
    const amt = stateNum === 1
      ? (p.cuota || 0) + (p.mora || 0)
      : (p.cuota || 0) + moraPD * daysSinceBDay;

    const pillLabel = stateNum === 0 ? '' : (stateNum === 1 ? ICON.check : ICON.cross);
    const pillTitle = stateNum === 0 ? 'Cumplea\u00F1ero (bloqueado)' : (stateNum === 1 ? 'Pag\u00F3' : 'Pendiente');
    const avatarInner = p.foto
      ? `<img src="${esc(p.foto)}" class="avatar-img" alt="">`
      : esc(initials(p.n));

    row.innerHTML = `
      ${stateNum === 0 ? '<span class="crown">' + ICON.crown + '</span>' : ''}
      <div class="avatar" style="${p.foto ? '' : `background:${colorFor(i)}`}">
        ${avatarInner}
      </div>
      <div class="row-mid">
        <div class="row-name">${esc(p.n)}</div>
        <div class="row-meta">${ICON.cal} ${esc(p.d)} \u00B7 ${ICON.phone} ${esc(p.tel || 'S/N')}</div>
      </div>
      <div class="row-right">
        <span class="amt">S/${amt}</span>
        <button class="state-pill state-${stateNum}" data-i="${i}" title="${pillTitle}" aria-label="Cambiar estado de ${esc(p.n)}">${pillLabel}</button>
        <button class="kebab-btn" data-i="${i}" aria-label="M\u00E1s opciones">${ICON.dots}</button>
      </div>
    `;
    row.style.animationDelay = Math.min(i * 45, 500) + 'ms';
    listEl.appendChild(row);
  });

  // Un clic alterna al instante pag\u00F3 (1) \u2194 no pag\u00F3 (2).
  // Marcar/quitar cumplea\u00F1ero (0) se hace desde el men\u00FA \u22EE (sin retardo de doble clic).
  listEl.querySelectorAll('.state-pill').forEach(btn=>{
    btn.addEventListener('click', ()=> togglePaid(+btn.dataset.i));
  });

  listEl.querySelectorAll('.kebab-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = +btn.dataset.i;
      if (kebabMenuEl) { closeKebabMenu(); return; }
      openKebabMenu(btn, i);
    });
  });

  checkUpcoming();
}

function closeKebabMenu() {
  if (kebabMenuEl) { kebabMenuEl.remove(); kebabMenuEl = null; }
}

function openKebabMenu(btn, i) {
  closeKebabMenu();
  const screen = document.getElementById('captureTarget');
  const btnRect = btn.getBoundingClientRect();
  const screenRect = screen.getBoundingClientRect();
  const isBday = parseInt((excelTabsData[currentTab][i] || {}).state) === 0;
  const menu = document.createElement('div');
  menu.className = 'kebab-menu';
  menu.innerHTML = `<button type="button" data-act="bday">${isBday ? 'Quitar cumplea\u00F1ero' : ICON.crown + ' Cumplea\u00F1ero'}</button><button type="button" data-act="edit">Editar</button><button type="button" data-act="del">Eliminar</button>`;

  menu.style.right = (screenRect.right - btnRect.right) + 'px';

  menu.addEventListener('click', e => {
    const act = e.target.closest('button')?.dataset.act;
    if (act === 'bday') { closeKebabMenu(); toggleBirthday(i); }
    if (act === 'edit') { closeKebabMenu(); openPersonModal(i); }
    if (act === 'del') { closeKebabMenu(); deletePerson(i); }
  });
  screen.appendChild(menu);

  // Posicionar seg\u00FAn el alto real del men\u00FA: debajo del bot\u00F3n si cabe, si no encima.
  const menuH = menu.offsetHeight;
  const spaceBelow = screenRect.bottom - btnRect.bottom;
  if (spaceBelow > menuH + 8) {
    menu.style.top = (btnRect.bottom - screenRect.top + 4) + 'px';
  } else {
    menu.style.top = (btnRect.top - screenRect.top - menuH - 4) + 'px';
  }
  kebabMenuEl = menu;
  setTimeout(() => document.addEventListener('click', outsideKebabClose, { once: true }), 0);
}

function outsideKebabClose(e) {
  if (kebabMenuEl && !kebabMenuEl.contains(e.target)) closeKebabMenu();
}

async function saveExcel() {
  if (saving || Object.keys(excelTabsData).length === 0) return;
  saving = true;

  const wb = XLSX.utils.book_new();
  for (const [sheetName, people] of Object.entries(excelTabsData)) {
    const header = ['Cuota', 'Mora', 'Telefono', 'Nombre', 'Fecha', 'Estado', 'Foto'];
    const data = [header];
    people.forEach(p => {
      data.push([p.cuota || 0, p.mora || 0, p.tel || '', p.n, p.d, p.state, p.foto || '']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), sheetName);
  }
  if (otrosData && otrosData.length > 0) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(otrosData), 'otros');
  }

  const wbArray = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });

  if (excelFileHandle) {
    try {
      const writable = await excelFileHandle.createWritable();
      await writable.write(wbArray);
      await writable.close();
      saving = false;
      return;
    } catch (e) {
      console.warn('File handle save failed, trying alternatives', e);
    }
  }

  try {
    await serverSave(XLSX.write(wb, { type: 'base64', bookType: 'xlsx' }));
    saving = false;
    return;
  } catch {}

  const blob = new Blob([wbArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Cumple.xlsx';
  a.click();
  URL.revokeObjectURL(a.href);
  saving = false;
}

function calcPersonAmount(p) {
  const moraPD = (tabConfig[currentTab]?.moraPorDia) || 0;
  if (parseInt(p.state) === 1) return (p.cuota || 0) + (p.mora || 0);
  if (parseInt(p.state) === 2) {
    const bp = (excelTabsData[currentTab] || []).find(x => parseInt(x.state) === 0);
    const days = bp ? daysSinceLastBDay(bp.d) : 0;
    return (p.cuota || 0) + moraPD * days;
  }
  return 0;
}

function updateSummary(){
  const people = excelTabsData[currentTab] || [];
  const validPayers = people.filter(p => parseInt(p.state) !== 0);

  const goalCount = validPayers.length;
  const paidCount = validPayers.filter(p => parseInt(p.state) === 1).length;
  const collectedAmount = validPayers.filter(p => parseInt(p.state) === 1).reduce((sum, p) => sum + calcPersonAmount(p), 0);
  const goalAmount = validPayers.reduce((sum, p) => sum + calcPersonAmount(p), 0);
  const pct = goalAmount > 0 ? Math.round((collectedAmount / goalAmount) * 100) : 0;
  const pendingCount = goalCount - paidCount;
  const remaining = Math.max(goalAmount - collectedAmount, 0);

  animateNumber(document.getElementById('totalAmount'), collectedAmount);
  const fillEl = document.getElementById('progressFill');
  fillEl.style.width = pct + '%';
  fillEl.classList.toggle('complete', pct === 100 && goalCount > 0);
  document.getElementById('pctLabel').textContent = `${pct}%`;
  document.getElementById('payersLabel').textContent = `${paidCount} de ${goalCount} personas`;
  document.getElementById('pendingLabel').textContent = pendingCount === 0 && goalCount > 0 ? '\u00A1Completo!' : `Faltan S/${remaining}`;
  document.getElementById('peopleCount').textContent = `${people.length} personas`;

  const waBtn = document.getElementById('waBtn');
  waBtn.classList.toggle('has-pending', pendingCount > 0);

  if (pct === 100 && goalCount > 0 && lastPct !== 100) launchConfetti();
  lastPct = pct;
}

// --- PROCESAMIENTO DEL WORKBOOK (extra\u00EDdo para reuso) ---
function processWorkbook(data, dataType) {
  const workbook = XLSX.read(data, {type: dataType || 'array', cellDates: true, raw: false});

  const headerKeywords = {
    n: ['nombre','name','nombres','names','integrante','integrantes','persona','personas','colaborador','miembro','participante'],
    d: ['fecha','date','cumplea\u00F1os','cumple','birthday','nacimiento','d\u00EDa','dia','nac'],
    state: ['estado','state','status','pag\u00F3','pago','pagado','paid','situaci\u00F3n','situacion','yape\u00F3','yapeo'],
    tel: ['tel\u00E9fono','telefono','tel','telef\u00F3no','celular','cel','whatsapp','wa','contacto','n\u00FAmero','numero','m\u00F3vil','movil'],
    cuota: ['cuota','monto','aporte','contribucion','contribuci\u00F3n'],
    mora: ['mora','morosidad','penalidad','recargo','interes','inter\u00E9s'],
    foto: ['foto','photo','imagen','picture','avatar','pic']
  };

  function detectCols(rows, maxScan) {
    for (let r = 0; r < Math.min(maxScan || 5, rows.length); r++) {
      const row = rows[r];
      if (!row || !Array.isArray(row)) continue;
      const vals = row.map(v => String(v || '').toLowerCase().trim());
      let found = {n:false, d:false, state:false, tel:false, cuota:false, mora:false, foto:false};
      const map = {};
      vals.forEach((v, ci) => {
        for (const [key, keywords] of Object.entries(headerKeywords)) {
          if (keywords.some(kw => v.includes(kw) || v === kw)) {
            if (!found[key]) { map[key] = ci; found[key] = true; }
          }
        }
      });
      if (found.n) {
        if (!found.d) map.d = -1;
        if (!found.state) map.state = -1;
        if (!found.tel) map.tel = -1;
        if (!found.cuota) map.cuota = -1;
        if (!found.mora) map.mora = -1;
        if (!found.foto) map.foto = -1;
        return { headIdx: r + 1, colMap: map };
      }
    }
    return null;
  }

  const fallbacks = [
    {n:0, d:1, state:2, tel:3, cuota:0, mora:1, foto:-1},
    {n:1, d:2, state:3, tel:4, cuota:0, mora:1, foto:-1},
    {n:0, d:2, state:3, tel:4, cuota:0, mora:1, foto:-1},
    {n:1, d:0, state:2, tel:3, cuota:-1, mora:-1, foto:-1},
  ];

  function fmtDate(v) {
    if (v == null || v === '') return 'S/F';
    if (v instanceof Date && !isNaN(v)) {
      return v.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
    }
    if (typeof v === 'number') {
      const d = new Date(Date.UTC(1899, 11, 30 + Math.floor(v)));
      if (!isNaN(d)) return d.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
    }
    return String(v).trim();
  }

  function parseNum(v) {
    if (v === undefined || v === null) return 0;
    if (typeof v === 'number') return v;
    const s = String(v).replace(/[^0-9.,]/g, '').replace(',', '.');
    return parseFloat(s) || 0;
  }

  let newTabsData = {};
  let validTabFound = false;
  tabConfig = {};

  workbook.SheetNames.forEach(sheetName => {
    const worksheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

    if (sheetName.trim().toLowerCase() === "otros") {
      otrosData = rows;
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || !Array.isArray(row) || !row[0]) continue;
        const name = String(row[0]).trim();
        const cuota = parseFloat(row[1]) || 0;
        const moraPD = parseFloat(row[2]) || 0;
        const grupo = row[3] != null ? String(row[3]).trim() : '';
        const enlace = row[4] != null ? String(row[4]).trim() : '';
        if (name) tabConfig[name] = { cuota, moraPorDia: moraPD, grupo, enlace };
      }
      return;
    }

    if (!rows || rows.length < 1) return;

    let headIdx = 0;
    let colMap = null;

    const detected = detectCols(rows, 5);
    if (detected) {
      headIdx = detected.headIdx;
      colMap = detected.colMap;
    } else {
      for (const fb of fallbacks) {
        const test = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !Array.isArray(r)) continue;
          const name = r[fb.n];
          if (name && String(name).trim()) test.push(name);
        }
        if (test.length > 0) {
          headIdx = 1;
          colMap = fb;
          break;
        }
      }
      if (!colMap) {
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !Array.isArray(r)) continue;
          for (let c = 0; c < Math.min(6, r.length); c++) {
            if (r[c] && String(r[c]).trim()) {
              headIdx = i;
              colMap = {n: c, d: c+1 >= 0 ? c+1 : -1, state: c+2, tel: c+3, cuota: c >= 0 ? c : -1, mora: -1, foto: -1};
              break;
            }
          }
          if (colMap) break;
        }
        if (!colMap) return;
      }
    }

    const parsedPeople = [];
    for (let i = headIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row || !Array.isArray(row)) continue;
      const name = row[colMap.n];
      if (!name || !String(name).trim()) continue;

      const cuota = colMap.cuota >= 0 ? parseNum(row[colMap.cuota]) : 0;
      const mora = colMap.mora >= 0 ? parseNum(row[colMap.mora]) : 0;

      parsedPeople.push({
        n: String(name).trim(),
        d: colMap.d >= 0 && row[colMap.d] != null ? fmtDate(row[colMap.d]) : "S/F",
        state: colMap.state >= 0 && row[colMap.state] !== undefined ? parseInt(row[colMap.state]) : 2,
        tel: colMap.tel >= 0 && row[colMap.tel] ? String(row[colMap.tel]).trim() : "",
        cuota,
        mora,
        foto: colMap.foto >= 0 && row[colMap.foto] ? String(row[colMap.foto]).trim() : "",
        amount: cuota + mora
      });
    }

    if (parsedPeople.length > 0) {
      sortByMD(parsedPeople);
      newTabsData[sheetName] = parsedPeople;
      if (!validTabFound) {
        currentTab = sheetName;
        validTabFound = true;
      }
    }
  });

  if (validTabFound) {
    excelTabsData = newTabsData;
    renderTabs();
    render();
    updateSummary();
    checkUpcoming();
    showToast("\u00A1Pesta\u00F1as cargadas con \u00E9xito!");
  } else {
    showToast("No se encontraron registros v\u00E1lidos en el archivo.");
  }
}

// Envoltura con manejo de errores visible: si XLSX no carg\u00F3 o el archivo falla, avisa.
function loadWorkbook(bytes, type) {
  if (typeof XLSX === 'undefined') {
    showToast('No se carg\u00F3 la librer\u00EDa de Excel (revisa tu conexi\u00F3n)');
    return;
  }
  try {
    processWorkbook(bytes, type);
  } catch (err) {
    console.error('Error al leer el Excel:', err);
    showToast('No se pudo leer el Excel: ' + (err && err.message ? err.message : err));
  }
}

function openExcel() {
  // La File System Access API (showOpenFilePicker) solo funciona en http(s).
  // En file:// (abrir por doble clic) Chrome la bloquea; ademas, usarla tras un
  // await "gasta" el clic del usuario y el navegador bloquea el respaldo.
  // Por eso, si no es usable, abrimos el selector clasico de inmediato (mismo clic).
  const canUseFS = typeof window.showOpenFilePicker === 'function' && location.protocol !== 'file:';
  if (!canUseFS) {
    document.getElementById('excelFile').click();
    return;
  }
  window.showOpenFilePicker({
    id: 'cumple-excel',
    types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }],
    multiple: false,
  }).then(async ([handle]) => {
    excelFileHandle = handle;
    const file = await handle.getFile();
    const reader = new FileReader();
    reader.onload = function(e) { loadWorkbook(new Uint8Array(e.target.result)); };
    reader.readAsArrayBuffer(file);
  }).catch((err) => {
    if (err && err.name === 'AbortError') return;
    document.getElementById('excelFile').click();
  });
}

document.getElementById('excelFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { loadWorkbook(new Uint8Array(e.target.result)); };
  reader.readAsArrayBuffer(file);
});

// --- INICIO: intentar servidor local, si no, mostrar estado vac\u00EDo ---
async function initApp() {
  try {
    const resp = await fetch(`http://localhost:${SERVER_PORT}/api/read`);
    if (resp.ok) {
      const json = await resp.json();
      if (json.ok && json.data) {
        const bytes = Uint8Array.from(atob(json.data), c => c.charCodeAt(0));
        loadWorkbook(bytes, 'array');
        return;
      }
    }
  } catch {}
  renderEmptyState();
}

function formatDateShort(dateStr) {
  if (!dateStr || dateStr === 'S/F') return '';
  const parts = dateStr.split('/');
  if (parts.length !== 3) return dateStr;
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return parseInt(parts[0]) + ' ' + months[parseInt(parts[1]) - 1];
}

function daysUntilBDay(dateStr) {
  if (!dateStr || dateStr === 'S/F') return null;
  const parts = dateStr.split('/');
  if (parts.length !== 3) return null;
  const today = new Date();
  const bday = new Date(today.getFullYear(), +parts[1] - 1, +parts[0]);
  if (bday < today) bday.setFullYear(bday.getFullYear() + 1);
  return Math.ceil((bday - today) / (1000 * 60 * 60 * 24));
}

function daysSinceLastBDay(dateStr) {
  if (!dateStr || dateStr === 'S/F') return 0;
  const parts = dateStr.split('/');
  if (parts.length !== 3) return 0;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const bday = new Date(today.getFullYear(), +parts[1] - 1, +parts[0]);
  bday.setHours(0, 0, 0, 0);
  if (bday > today) return 0;
  return Math.floor((today - bday) / (1000 * 60 * 60 * 24));
}

function checkUpcoming() {
  const people = excelTabsData[currentTab] || [];
  let minDays = Infinity;
  const upcoming = people.filter(p => {
    const d = daysUntilBDay(p.d);
    if (d !== null && d < minDays) minDays = d;
    return d !== null;
  });
  const btn = document.getElementById('upcomingBtn');
  if (!btn) return;
  if (upcoming.length === 0 || minDays === Infinity) {
    btn.classList.remove('has-pending');
    btn.title = 'Recordatorio de cumplea\u00F1os';
    return;
  }
  const next = upcoming.filter(p => daysUntilBDay(p.d) === minDays);
  const names = next.map(p => p.n).join(', ');
  const fecha = formatDateFull(next[0].d);
  btn.classList.add('has-pending');
  btn.title = `Recordatorio de cumplea\u00F1os \u00B7 ${names} ${fecha} (${minDays} d\u00EDa${minDays === 1 ? '' : 's'})`;
}

function formatDateFull(dateStr) {
  if (!dateStr || dateStr === 'S/F') return '';
  const parts = dateStr.split('/');
  if (parts.length !== 3) return dateStr;
  const day = String(parseInt(parts[0])).padStart(2, '0');
  const month = MESES[parseInt(parts[1]) - 1] || '';
  return `${day} ${month.charAt(0).toUpperCase() + month.slice(1)}`;
}

// --- ADMIN / CRUD ---
function parseMD(s) {
  if (!s || s === 'S/F') return { d: 99, m: 99 };
  const p = s.split('/');
  return { d: parseInt(p[0]) || 99, m: parseInt(p[1]) || 99 };
}
function sortByMD(arr) {
  arr.sort((a, b) => {
    const ma = parseMD(a.d), mb = parseMD(b.d);
    return ma.m !== mb.m ? ma.m - mb.m : ma.d - mb.d;
  });
}

function openPersonModal(i) {
  if (!currentTab || !excelTabsData[currentTab]) {
    showToast('Primero carga un archivo Excel');
    return;
  }
  editingIndex = (i === undefined || i === null) ? null : i;
  document.body.style.overflow = 'hidden';
  document.getElementById('personModal').classList.add('open');
  document.getElementById('modalTitle').textContent = editingIndex !== null ? 'Editar aportante' : 'Nuevo aportante';
  document.getElementById('adminFormSubmit').textContent = editingIndex !== null ? 'Actualizar' : 'A\u00F1adir';
  if (editingIndex !== null) fillForm(excelTabsData[currentTab][editingIndex]);
  else resetForm();
}

function closePersonModal() {
  document.body.style.overflow = '';
  document.getElementById('personModal').classList.remove('open');
}

function openConfigModal() {
  if (!Object.keys(excelTabsData).length) {
    showToast('Primero carga un archivo Excel');
    return;
  }
  document.body.style.overflow = 'hidden';
  document.getElementById('configModal').classList.add('open');
  renderAdminConfig();
}

function closeConfigModal() {
  document.body.style.overflow = '';
  document.getElementById('configModal').classList.remove('open');
}

function renderAdminConfig() {
  const container = document.getElementById('adminConfigList');
  const tabs = Object.keys(excelTabsData);
  if (!tabs.length) {
    container.innerHTML = '<div class="modal-empty">No hay pesta\u00F1as cargadas</div>';
    return;
  }
  container.innerHTML = tabs.map((tab, idx) => {
    const cfg = tabConfig[tab] || { cuota: 20, moraPorDia: 0, grupo: '', enlace: '' };
    return `
      <div class="config-item">
        <span class="tab-label">${tab.replace(/</g,'&lt;')}</span>
        <div class="fields">
          <label>Cuota S/</label>
          <input type="number" step="0.5" min="0" value="${cfg.cuota}" data-idx="${idx}" data-field="cuota" class="cfg-input">
          <label>Mora</label>
          <input type="number" step="0.5" min="0" value="${cfg.moraPorDia}" data-idx="${idx}" data-field="moraPorDia" class="cfg-input">
          <label>Grupo</label>
          <input type="text" value="${esc(cfg.grupo || '')}" data-idx="${idx}" data-field="grupo" class="cfg-input cfg-grupo" placeholder="Nombre del grupo">
          <label>Enlace</label>
          <input type="text" value="${esc(cfg.enlace || '')}" data-idx="${idx}" data-field="enlace" class="cfg-input cfg-grupo" placeholder="chat.whatsapp.com/...">
        </div>
      </div>
    `;
  }).join('');
}

function resetForm() {
  document.getElementById('adminForm').reset();
  document.getElementById('fCuota').value = '0';
  document.getElementById('fMora').value = '0';
  document.getElementById('fState').value = '2';
  document.getElementById('adminFormSubmit').textContent = 'A\u00F1adir';
  currentPhotoData = '';
  updatePhotoPreview('');
  editingIndex = null;
}

function fillForm(p) {
  document.getElementById('fName').value = p.n || '';
  document.getElementById('fDate').value = p.d || '';
  document.getElementById('fPhone').value = p.tel || '';
  document.getElementById('fCuota').value = p.cuota || 0;
  document.getElementById('fMora').value = p.mora || 0;
  document.getElementById('fState').value = p.state || 2;
  currentPhotoData = p.foto || '';
  updatePhotoPreview(currentPhotoData);
}

function submitPerson(e) {
  e.preventDefault();
  const n = document.getElementById('fName').value.trim();
  if (!n) { showToast('El nombre es obligatorio'); return; }
  const data = {
    n,
    d: document.getElementById('fDate').value.trim(),
    tel: document.getElementById('fPhone').value.trim(),
    cuota: parseFloat(document.getElementById('fCuota').value) || 0,
    mora: parseFloat(document.getElementById('fMora').value) || 0,
    state: parseInt(document.getElementById('fState').value) || 2,
    foto: currentPhotoData || '',
    amount: 0
  };
  if (editingIndex !== null) {
    excelTabsData[currentTab][editingIndex] = data;
  } else {
    excelTabsData[currentTab].push(data);
  }
  sortByMD(excelTabsData[currentTab]);
  const wasEditing = editingIndex !== null;
  resetForm();
  closePersonModal();
  render();
  updateSummary();
  saveExcel();
  showToast(wasEditing ? 'Actualizado' : 'A\u00F1adido');
}

function togglePaid(i) {
  const target = excelTabsData[currentTab] && excelTabsData[currentTab][i];
  if (!target || parseInt(target.state) === 0) return; // el cumplea\u00F1ero no cambia aqu\u00ED
  const wasPending = target.state == 2;
  if (target.state == 2) {
    const moraPD = (tabConfig[currentTab]?.moraPorDia) || 0;
    const bp = (excelTabsData[currentTab] || []).find(x => parseInt(x.state) === 0);
    const days = bp ? daysSinceLastBDay(bp.d) : 0;
    target.mora = moraPD * days;
    target.state = 1;
  } else {
    target.state = 2;
  }
  render();
  updateSummary();
  saveExcel();
  if (wasPending && target.state == 1) {
    const pending = (excelTabsData[currentTab] || []).filter(p => parseInt(p.state) === 2);
    if (pending.length === 0) sendMissionComplete();
  }
}

function toggleBirthday(i) {
  const target = excelTabsData[currentTab] && excelTabsData[currentTab][i];
  if (!target) return;
  target.state = parseInt(target.state) === 0 ? 2 : 0;
  target.mora = 0;
  render();
  updateSummary();
  saveExcel();
}

function deletePerson(i) {
  if (!confirm('\u00BFEliminar esta persona?')) return;
  excelTabsData[currentTab].splice(i, 1);
  sortByMD(excelTabsData[currentTab]);
  render();
  updateSummary();
  saveExcel();
  showToast('Eliminado');
}

document.getElementById('configBtn').addEventListener('click', openConfigModal);
document.getElementById('personModalClose').addEventListener('click', closePersonModal);
document.getElementById('personModalCancel').addEventListener('click', closePersonModal);
document.getElementById('configModalClose').addEventListener('click', closeConfigModal);

document.getElementById('adminConfigList').addEventListener('change', function(e) {
  if (e.target.classList.contains('cfg-input')) {
    const idx = parseInt(e.target.dataset.idx);
    const field = e.target.dataset.field;
    const tab = Object.keys(excelTabsData)[idx];
    if (tab) {
      if (!tabConfig[tab]) tabConfig[tab] = { cuota: 20, moraPorDia: 0, grupo: '', enlace: '' };
      if (field === 'grupo' || field === 'enlace') tabConfig[tab][field] = e.target.value.trim();
      else tabConfig[tab][field] = parseFloat(e.target.value) || 0;
    }
  }
});
document.getElementById('saveConfigBtn').addEventListener('click', function() {
  otrosData = [['Tab', 'Cuota', 'Mora/Dia', 'Grupo', 'Enlace']];
  for (const [tab, cfg] of Object.entries(tabConfig)) {
    otrosData.push([tab, cfg.cuota, cfg.moraPorDia, cfg.grupo || '', cfg.enlace || '']);
  }
  render();
  updateSummary();
  saveExcel();
  showToast('Configuraci\u00F3n guardada');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
